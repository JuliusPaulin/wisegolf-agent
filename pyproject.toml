[project]
name = "wisegolf-agent"
version = "0.1.0"
description = "Snipe golf tee times on WiseGolf"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "playwright>=1.47",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
wisegolf = "wisegolf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisegolf"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
